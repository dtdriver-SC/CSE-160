<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment 3 - Grass Cookie Climb</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1117;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }
    #webgl {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #5d8cff;
      cursor: crosshair;
    }
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      width: 330px;
      padding: 12px;
      background: rgba(255,255,255,0.88);
      border: 2px solid #111;
      color: #111;
      line-height: 1.35;
      font-size: 14px;
      box-sizing: border-box;
    }
    #hud h1 {
      margin: 0 0 6px 0;
      font-size: 18px;
    }
    #hud p {
      margin: 4px 0;
    }
    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 18px;
      margin-left: -9px;
      margin-top: -9px;
      pointer-events: none;
    }
    #crosshair:before, #crosshair:after {
      content: "";
      position: absolute;
      background: rgba(0,0,0,0.75);
    }
    #crosshair:before { left: 8px; top: 0; width: 2px; height: 18px; }
    #crosshair:after { left: 0; top: 8px; width: 18px; height: 2px; }
  </style>
</head>
<body onload="main()">
  <canvas id="webgl" width="960" height="640">
    Please use a browser that supports canvas.
  </canvas>

  <div id="hud">
    <h1>Grass Cookie Climb</h1>
    <p><strong>Goal:</strong> jump up the dirt blocks next to spawn and win the cookie.</p>
    <p><strong>Controls:</strong> W/A/S/D move, Space jump, Q/E turn, mouse look.</p>
    <p><strong>Blocks:</strong> F or left click add, R or right click delete.</p>
    <p id="status">Loading world...</p>
  </div>
  <div id="crosshair"></div>

  <script src="Matrix4.js"></script>
  <script src="Camera.js"></script>
  <script src="Cube.js"></script>
  <script src="World.js"></script>
</body>
</html>
